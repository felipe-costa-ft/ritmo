name: Criar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Gerar executável
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name RITMO
          main.py

      - name: Empacotar Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/RITMO `
            -DestinationPath RITMO-Windows-x64.zip

      - name: Empacotar macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/RITMO.app \
            RITMO-macOS.zip

      - name: Preparar artefato do Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: RITMO-Windows-x64.zip
          if-no-files-found: error

      - name: Preparar artefato do macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: RITMO-macOS.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar pacote Linux em manylinux2014
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail
              /opt/python/cp310-cp310/bin/python -m pip install --upgrade pip
              /opt/python/cp310-cp310/bin/python -m pip install --only-binary=:all: -r requirements.txt
              /opt/python/cp310-cp310/bin/python -m pip install --only-binary=:all: pyinstaller
              /opt/python/cp310-cp310/bin/pyinstaller \
                --noconfirm \
                --clean \
                --windowed \
                --name RITMO \
                main.py
              if find dist/RITMO -type f -print0 \
                | xargs -0 strings \
                | grep -E "GLIBC_2\.([3-9][8-9]|[4-9][0-9])"; then
                echo "O pacote Linux referencia uma versao de glibc nova demais."
                exit 1
              fi
              tar -czf RITMO-Linux-x64.tar.gz -C dist RITMO
            '

      - name: Preparar artefato do Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: RITMO-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publicar release
    needs:
      - build-desktop
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar executáveis
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --title "RITMO ${GITHUB_REF_NAME}" \
            --generate-notes
